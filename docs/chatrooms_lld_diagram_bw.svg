<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="2000" height="1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Sharp Black Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="2000" height="1000" fill="#ffffff" />

  <!-- ==================== ORTHOGONAL CONNECTORS ==================== -->
  
  <!-- 1. AuthController -> StorageService (delegates to) -->
  <path d="M 260 270 L 260 460" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <rect x="200" y="350" width="120" height="26" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="3" />
  <text x="260" y="368" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">delegates to</text>

  <!-- 2. WorkspaceController -> StorageService (delegates to) -->
  <path d="M 640 270 L 640 340 L 420 340 L 420 460" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <rect x="470" y="327" width="120" height="26" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="3" />
  <text x="530" y="345" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">delegates to</text>

  <!-- 3. ContactController -> StorageService (delegates to) -->
  <path d="M 1020 270 L 1020 380 L 560 380 L 560 460" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <rect x="740" y="367" width="120" height="26" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="3" />
  <text x="800" y="385" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">delegates to</text>

  <!-- 4. ChatSocketHandler -> StorageService (async persists) -->
  <path d="M 820 600 L 650 600" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <rect x="680" y="587" width="120" height="26" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="3" />
  <text x="740" y="605" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">async persists</text>

  <!-- 5. ClientChatStore -> ChatSocketHandler (WSS event relay) -->
  <path d="M 1480 380 L 1380 380 L 1380 540 L 1290 540" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <rect x="1310" y="447" width="140" height="26" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="3" />
  <text x="1380" y="465" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">WSS event relay</text>

  <!-- 6. WebRTCEngine -> ChatSocketHandler (SDP/ICE signaling) -->
  <path d="M 1480 760 L 1380 760 L 1380 660 L 1290 660" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <rect x="1300" y="697" width="160" height="26" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="3" />
  <text x="1380" y="715" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">SDP/ICE signaling</text>


  <!-- ==================== TOP ROW: CONTROLLERS ==================== -->

  <!-- Box 1: AuthController -->
  <g id="AuthController">
    <rect x="90" y="80" width="340" height="190" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect x="90" y="80" width="340" height="46" fill="#f8fafc" stroke="#000000" stroke-width="2" />
    <text x="260" y="110" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">AuthController</text>
    <text x="110" y="152" font-size="15" fill="#1e293b">- jwtSecret: String</text>
    <text x="110" y="176" font-size="15" fill="#1e293b">- tokenExpiry: String</text>
    <line x1="90" y1="190" x2="430" y2="190" stroke="#000000" stroke-width="1.5" />
    <text x="110" y="218" font-size="15" fill="#1e293b">+ register(userData)</text>
    <text x="110" y="242" font-size="15" fill="#1e293b">+ login(credentials)</text>
    <text x="110" y="264" font-size="15" fill="#1e293b">+ updateProfile(data)</text>
  </g>

  <!-- Box 2: WorkspaceController -->
  <g id="WorkspaceController">
    <rect x="470" y="80" width="340" height="190" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect x="470" y="80" width="340" height="46" fill="#f8fafc" stroke="#000000" stroke-width="2" />
    <text x="640" y="110" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">WorkspaceController</text>
    <text x="490" y="152" font-size="15" fill="#1e293b">- codeGenerator: Function</text>
    <line x1="470" y1="172" x2="810" y2="172" stroke="#000000" stroke-width="1.5" />
    <text x="490" y="202" font-size="15" fill="#1e293b">+ createWorkspace(data)</text>
    <text x="490" y="228" font-size="15" fill="#1e293b">+ joinWorkspace(code)</text>
    <text x="490" y="254" font-size="15" fill="#1e293b">+ createChannel(name)</text>
  </g>

  <!-- Box 3: ContactController -->
  <g id="ContactController">
    <rect x="850" y="80" width="340" height="190" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect x="850" y="80" width="340" height="46" fill="#f8fafc" stroke="#000000" stroke-width="2" />
    <text x="1020" y="110" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">ContactController</text>
    <text x="870" y="152" font-size="15" fill="#1e293b">- model: PersonalGroup</text>
    <line x1="850" y1="172" x2="1190" y2="172" stroke="#000000" stroke-width="1.5" />
    <text x="870" y="202" font-size="15" fill="#1e293b">+ getContacts()</text>
    <text x="870" y="228" font-size="15" fill="#1e293b">+ createPersonalGroup()</text>
    <text x="870" y="254" font-size="15" fill="#1e293b">+ deleteContact(id)</text>
  </g>


  <!-- ==================== MIDDLE ROW: SERVICES ==================== -->

  <!-- Box 4: StorageService -->
  <g id="StorageService">
    <rect x="170" y="460" width="480" height="280" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect x="170" y="460" width="480" height="48" fill="#f8fafc" stroke="#000000" stroke-width="2" />
    <text x="410" y="492" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">StorageService</text>
    <text x="195" y="536" font-size="15" fill="#1e293b">- dbConnection: Mongoose</text>
    <line x1="170" y1="556" x2="650" y2="556" stroke="#000000" stroke-width="1.5" />
    <text x="195" y="588" font-size="15" fill="#1e293b">+ createUser(userData)</text>
    <text x="195" y="618" font-size="15" fill="#1e293b">+ saveMessage(payload)</text>
    <text x="195" y="648" font-size="15" fill="#1e293b">+ createGroup(name, parentId)</text>
    <text x="195" y="678" font-size="15" fill="#1e293b">+ markMessagesRead(chatId)</text>
    <text x="195" y="708" font-size="15" fill="#1e293b">+ getChatHistory(chatId)</text>
  </g>

  <!-- Box 5: ChatSocketHandler -->
  <g id="ChatSocketHandler">
    <rect x="820" y="460" width="470" height="280" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect x="820" y="460" width="470" height="48" fill="#f8fafc" stroke="#000000" stroke-width="2" />
    <text x="1055" y="492" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">ChatSocketHandler</text>
    <text x="845" y="534" font-size="15" fill="#1e293b">- userSockets: Map&lt;String, Set&gt;</text>
    <text x="845" y="558" font-size="15" fill="#1e293b">- io: SocketServer</text>
    <line x1="820" y1="574" x2="1290" y2="574" stroke="#000000" stroke-width="1.5" />
    <text x="845" y="606" font-size="15" fill="#1e293b">+ setupChatSocket(io)</text>
    <text x="845" y="636" font-size="15" fill="#1e293b">+ handleSendMessage(data)</text>
    <text x="845" y="666" font-size="15" fill="#1e293b">+ handleTyping(data)</text>
    <text x="845" y="696" font-size="15" fill="#1e293b">+ handleCallSignaling(data)</text>
  </g>


  <!-- ==================== RIGHT COLUMN: CLIENT & WEBRTC ==================== -->

  <!-- Box 6: ClientChatStore -->
  <g id="ClientChatStore">
    <rect x="1480" y="270" width="430" height="240" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect x="1480" y="270" width="430" height="46" fill="#f8fafc" stroke="#000000" stroke-width="2" />
    <text x="1695" y="302" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">ClientChatStore</text>
    <text x="1505" y="342" font-size="15" fill="#1e293b">+ activeChat: Object</text>
    <text x="1505" y="366" font-size="15" fill="#1e293b">+ messagesMap: Map</text>
    <text x="1505" y="390" font-size="15" fill="#1e293b">+ onlineUsers: Array</text>
    <line x1="1480" y1="406" x2="1910" y2="406" stroke="#000000" stroke-width="1.5" />
    <text x="1505" y="436" font-size="15" fill="#1e293b">+ sendMessage(text, file)</text>
    <text x="1505" y="462" font-size="15" fill="#1e293b">+ createGroup(name, parentId)</text>
    <text x="1505" y="488" font-size="15" fill="#1e293b">+ setActiveChat(chat)</text>
  </g>

  <!-- Box 7: WebRTCEngine -->
  <g id="WebRTCEngine">
    <rect x="1480" y="640" width="430" height="230" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect x="1480" y="640" width="430" height="46" fill="#f8fafc" stroke="#000000" stroke-width="2" />
    <text x="1695" y="672" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">WebRTCEngine</text>
    <text x="1505" y="712" font-size="15" fill="#1e293b">- peerConnection: RTCPeerConnection</text>
    <text x="1505" y="736" font-size="15" fill="#1e293b">- iceServers: Array</text>
    <line x1="1480" y1="752" x2="1910" y2="752" stroke="#000000" stroke-width="1.5" />
    <text x="1505" y="782" font-size="15" fill="#1e293b">+ createOffer(): Promise</text>
    <text x="1505" y="808" font-size="15" fill="#1e293b">+ handleAnswer(sdp)</text>
    <text x="1505" y="834" font-size="15" fill="#1e293b">+ addIceCandidate(candidate)</text>
  </g>

</svg>